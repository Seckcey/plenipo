name: Release

# Builds the Windows installer and publishes a GitHub release with it attached, in either of two
# ways (docs/development/versioning.md → Releasing):
# - Actions → Release → Run workflow (on `main`): releases the version in package.json. The tag
#   `vX.Y.Z` is created on that commit only after the installer builds.
# - Pushing a tag `vX.Y.Z`: releases that commit.
#
# The installer and the app are signed as 8 West Ventures, LLC through Azure Artifact Signing
# (docs/development/code-signing.md). The signing secrets live in the GitHub Environment `release`
# (ADR-052, signing behind the owner's approval): only `main` and `v*` tags may use it, and the
# owner approves each release run before its job starts. Run workflow with "dry run" ticked uses
# the empty Environment `dry-run` instead: it builds an unsigned installer from any branch, with no
# approval and no secret, checks nothing about signing, and keeps the installer as a download; it
# publishes nothing.
#
# Updates (Phase 13, ADR-038): the installer also gets an updater signature made with the updater
# key (Environment secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD), the
# key's public half is built into Plenipo (repository variable PLENIPO_UPDATER_PUBLIC_KEY), and the
# release carries latest.json, which installed copies read once a day.
#
# Plenipo on your phone (Phase 14, ADR-149): a Linux job builds Plenipo's own relay as a static
# program (musl) with a .sha256, and the release carries it too; the relay's updater on 8 West's
# server fetches it from the release, as the phone page's updater does for the page. Both are
# signed like the installer (ADR-210, security finding P-SRV-1): after the owner's approval the
# Windows job signs them with the server key (Environment secrets PLENIPO_SERVER_SIGNING_KEY and
# its password; a key of its own, never the updater key), checks the signatures against the
# repository variable PLENIPO_SERVER_SIGNING_PUBLIC_KEY, and publishes the .sig next to each.
# The updaters install nothing without a signature that names the file and the version.
#
# Mac and Linux (Phase 23, ADR-150): a dry run also builds an unsigned trial file for the Mac,
# kept as a download for 7 days; a release builds it from Wave 3 on. Linux (Wave 2, ADR-152): a
# Linux job builds the .deb and the AppImage, with no secret, and checks that they install, start,
# and remove cleanly. After the owner's approval the Windows job gives the AppImage its updater
# signature, writes one latest.json for both systems, and publishes everything at once.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build an unsigned installer only, publish nothing (any branch, no approval)"
        type: boolean
        default: false

# Each job names what it may do (security finding P-WEB-3): only the job that publishes the
# release writes to the repository; every other job reads.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Plenipo's own relay (Phase 14, ADR-149): one static Linux program, built the same way CI checks
  # it, named for this version, with its checksum. No secret is needed, so a dry run builds it too.
  relay:
    name: Build Plenipo's relay (static Linux program)
    runs-on: ubuntu-latest
    # Builds and keeps a file; it never writes to the repository or a release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: relay-musl
      - name: Build it static, check it, and name it for this version
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p plenipo-relay --bin plenipo-relay
          version=$(node -p "require('./package.json').version")
          relay=target/x86_64-unknown-linux-musl/release/plenipo-relay
          file "$relay" | grep -q "static" || { echo "::error::The relay is not a static program"; file "$relay"; exit 1; }
          "$relay" --version | grep -qx "plenipo-relay $version" \
            || { echo "::error::The relay says $("$relay" --version), not $version"; exit 1; }
          # A release never carries the test hooks (they trust the contract's test key).
          if grep -q "the relay listens on" "$relay"; then
            echo "::error::The relay was built with its test hooks"
            exit 1
          fi
          PLENIPO_RELAY_OFF_FILE="$RUNNER_TEMP/plenipo-relay-off" "$relay" 18790 &
          pid=$!
          sleep 1
          curl -fsS http://127.0.0.1:18790/healthz | grep -qx ok
          kill -TERM "$pid"
          wait "$pid"
          mkdir -p relay-dist
          cp "$relay" "relay-dist/plenipo-relay-$version-linux-x86_64"
          (cd relay-dist && sha256sum "plenipo-relay-$version-linux-x86_64" > "plenipo-relay-$version-linux-x86_64.sha256")
          cat "relay-dist/plenipo-relay-$version-linux-x86_64.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plenipo-relay
          path: relay-dist/
          if-no-files-found: error
          retention-days: 7

  # The Mac (Phase 23, Wave 0; ADR-150): a dry run also builds the Mac's file, unsigned, to see
  # what Tauri makes. A dry run only: a release does not build it until Wave 3, and no secret is
  # used here (ADR-052). It is one app for Apple's chips and Intel. (Linux has its own job below.)
  trial:
    name: Trial build, unsigned (${{ matrix.name }})
    if: inputs.dry_run
    runs-on: ${{ matrix.runner }}
    # Builds and keeps files; it never writes to the repository or a release.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            runner: macos-latest
            target: universal-apple-darwin
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Both kinds of Mac chip
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: trial-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      - name: Build the app and its files, unsigned
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          # Not secrets; built in so a trial copy is otherwise the same as a release one.
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
          PLENIPO_MICROSOFT_APP_ID: ${{ vars.PLENIPO_MICROSOFT_APP_ID }}
          PLENIPO_SLACK_CLIENT_ID: ${{ vars.PLENIPO_SLACK_CLIENT_ID }}
          PLENIPO_GITHUB_CLIENT_ID: ${{ vars.PLENIPO_GITHUB_CLIENT_ID }}
          PLENIPO_GITHUB_APP_SLUG: ${{ vars.PLENIPO_GITHUB_APP_SLUG }}
          PLENIPO_RELAY_LIVE: ${{ vars.PLENIPO_RELAY_LIVE }}
          PLENIPO_CONNECTIONS_STAND_IN: ""
          PLENIPO_AI_TOOL_RELEASES: ""
          PLENIPO_REMOTE_STAND_IN: ""
          PLENIPO_REMOTE_PAGE: ""
          PLENIPO_NOTICES_STAND_IN: ""
        run: |
          args=(--verbose)
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          pnpm --filter @plenipo/desktop tauri build "${args[@]}"
      - name: What was made
        shell: bash
        env:
          FILES: ${{ matrix.files }}
        run: |
          {
            echo "### Trial build, unsigned: ${{ matrix.name }}"
            echo ""
            echo '```'
            for f in $FILES; do ls -l $f; done
            app=(target/universal-apple-darwin/release/bundle/macos/*.app)
            echo "Chips in ${app[0]##*/}: $(lipo -archs "${app[0]}/Contents/MacOS/"*)"
            echo "Lowest macOS: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "${app[0]}/Contents/Info.plist")"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plenipo-unsigned-trial-${{ matrix.name }}
          path: ${{ matrix.files }}
          retention-days: 7
          if-no-files-found: error

  # Linux (Phase 23, Wave 2; ADR-152): the .deb and the AppImage, built on Ubuntu 22.04 so they also
  # run on newer Linux, and checked: they are this version's, the .deb installs with apt, both
  # start and keep running, and apt removes Plenipo cleanly (scripts/linux-package-check.sh). No
  # secret is used here (ADR-052): after the owner's approval, the Windows job gives the AppImage
  # its updater signature and publishes it. A dry run builds and keeps them too.
  linux:
    name: Build and check the Linux files (.deb and AppImage)
    runs-on: ubuntu-22.04
    # Builds and keeps files; it never writes to the repository or a release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Tauri Linux system dependencies, and a desktop to start Plenipo on
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file \
            xvfb gnome-keyring dbus
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux
      - run: pnpm install --frozen-lockfile
      - name: Build the app, its .deb, and its AppImage
        env:
          # The updater key's public half, built in so the AppImage updates itself (ADR-038).
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
          PLENIPO_MICROSOFT_APP_ID: ${{ vars.PLENIPO_MICROSOFT_APP_ID }}
          PLENIPO_SLACK_CLIENT_ID: ${{ vars.PLENIPO_SLACK_CLIENT_ID }}
          PLENIPO_GITHUB_CLIENT_ID: ${{ vars.PLENIPO_GITHUB_CLIENT_ID }}
          PLENIPO_GITHUB_APP_SLUG: ${{ vars.PLENIPO_GITHUB_APP_SLUG }}
          PLENIPO_RELAY_LIVE: ${{ vars.PLENIPO_RELAY_LIVE }}
          # Never a test stand-in in a release (an empty value is ignored).
          PLENIPO_CONNECTIONS_STAND_IN: ""
          PLENIPO_AI_TOOL_RELEASES: ""
          PLENIPO_REMOTE_STAND_IN: ""
          PLENIPO_REMOTE_PAGE: ""
          PLENIPO_NOTICES_STAND_IN: ""
          # The AppImage tool unpacks itself instead of needing FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @plenipo/desktop tauri build --verbose
      - name: The files are this version's, install, start, and remove cleanly
        # `bash` (not the default shell) stops at a failure inside the pipe to `tee`.
        shell: bash
        run: |
          bash scripts/linux-package-check.sh 2>&1 | tee "$RUNNER_TEMP/linux-check.txt"
          {
            echo "### Linux files"
            echo ""
            echo '```'
            grep -E "^(The \.deb|The installed|The AppImage|apt removed)" "$RUNNER_TEMP/linux-check.txt"
            ls -l linux-dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plenipo-linux
          path: linux-dist/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Build Windows installer and publish release (Windows and Linux)
    needs: [relay, linux]
    runs-on: windows-latest
    # The only job that writes: it creates the tag (Run workflow) and publishes the release.
    permissions:
      contents: write
    # ADR-052: a release uses the Environment `release`, which holds the signing secrets, lets only
    # `main` and `v*` tags in, and waits for the owner's approval before the job starts. A dry run
    # uses `dry-run`, which holds nothing and asks nobody, so a dry run can never sign.
    environment: ${{ inputs.dry_run == true && 'dry-run' || 'release' }}
    steps:
      # Once the `release` Environment's branch rule is in place, GitHub refuses such a run before
      # this step; this step says why in plain words when the rule is not there yet.
      - name: Run workflow releases `main` only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.dry_run
        shell: bash
        run: |
          echo "::error::Run the Release workflow on main (it was started on $GITHUB_REF_NAME)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the product version, and release notes exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm versions:check
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: nothing is published, so the tag and release notes are not checked."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$version"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::error::$tag is already released; bump the version first"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::The tag $tag already exists; push it again to release it, or bump the version"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "::error::Tag $tag does not match the product version $version"
              exit 1
            fi
          fi
          if [ ! -f "docs/releases/$tag.md" ]; then
            echo "::error::Missing release notes: docs/releases/$tag.md"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      # A dry run has no secrets to check (ADR-052): it builds unsigned, further down.
      - name: Signing secrets are set
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLENIPO_SERVER_SIGNING_KEY: ${{ secrets.PLENIPO_SERVER_SIGNING_KEY }}
          PLENIPO_SERVER_SIGNING_KEY_PASSWORD: ${{ secrets.PLENIPO_SERVER_SIGNING_KEY_PASSWORD }}
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
          PLENIPO_SERVER_SIGNING_PUBLIC_KEY: ${{ vars.PLENIPO_SERVER_SIGNING_PUBLIC_KEY }}
          PLENIPO_MICROSOFT_APP_ID: ${{ vars.PLENIPO_MICROSOFT_APP_ID }}
          PLENIPO_SLACK_CLIENT_ID: ${{ vars.PLENIPO_SLACK_CLIENT_ID }}
          PLENIPO_GITHUB_CLIENT_ID: ${{ vars.PLENIPO_GITHUB_CLIENT_ID }}
          PLENIPO_GITHUB_APP_SLUG: ${{ vars.PLENIPO_GITHUB_APP_SLUG }}
        run: |
          # A release never signs in with the end-to-end tests' stand-in app IDs (Phase 20),
          # compared as the build reads them: without spaces, the Microsoft one in small letters.
          microsoft_id="$(printf %s "$PLENIPO_MICROSOFT_APP_ID" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          slack_id="$(printf %s "$PLENIPO_SLACK_CLIENT_ID" | tr -d '[:space:]')"
          github_id="$(printf %s "$PLENIPO_GITHUB_CLIENT_ID" | tr -d '[:space:]')"
          github_slug="$(printf %s "$PLENIPO_GITHUB_APP_SLUG" | tr -d '[:space:]')"
          if [ "$microsoft_id" = "0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0" ]; then
            echo "::error::Repository variable PLENIPO_MICROSOFT_APP_ID is the tests' stand-in ID; set 8 West's app ID (docs/phases/phase-20-microsoft-app-registration.md)"
            exit 1
          fi
          if [ "$slack_id" = "1111111111.2222222222" ]; then
            echo "::error::Repository variable PLENIPO_SLACK_CLIENT_ID is the tests' stand-in ID; set 8 West's Slack app's client ID (docs/phases/phase-20-slack-and-google-apps.md)"
            exit 1
          fi
          # Phase 25 (ADR-204): nor with the tests' stand-in GitHub App. Unset is fine: until the
          # owner registers 8 West's GitHub App, that copy's GitHub card says it has no app yet.
          if [ "$github_id" = "Iv1.0123456789abcdef" ] || [ "$github_slug" = "plenipo-test-app" ]; then
            echo "::error::Repository variable PLENIPO_GITHUB_CLIENT_ID or PLENIPO_GITHUB_APP_SLUG is the tests' stand-in; set 8 West's GitHub App's (docs/phases/phase-25-github-app.md)"
            exit 1
          fi
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            PLENIPO_SERVER_SIGNING_KEY PLENIPO_SERVER_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Environment secret $name is not set in the Environment 'release'; see docs/development/code-signing.md"
              exit 1
            fi
          done
          # Not secrets: the updater key's public half, built into Plenipo (ADR-038), and the
          # server key's, which the relay's and the phone page's servers trust (ADR-210).
          for name in PLENIPO_UPDATER_PUBLIC_KEY PLENIPO_SERVER_SIGNING_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set; see docs/development/code-signing.md"
              exit 1
            fi
          done
          # The server key is a key of its own: with one key for both, a signed installer could be
          # passed off as a relay program. Compared without spaces or line breaks, as they are used.
          if [ "$(printf '%s' "$PLENIPO_UPDATER_PUBLIC_KEY" | tr -d '[:space:]')" = "$(printf '%s' "$PLENIPO_SERVER_SIGNING_PUBLIC_KEY" | tr -d '[:space:]')" ]; then
            echo "::error::PLENIPO_SERVER_SIGNING_PUBLIC_KEY is the updater key; the server key must be a key of its own (docs/development/code-signing.md)"
            exit 1
          fi
          if [ "$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" = "$(printf '%s' "$PLENIPO_SERVER_SIGNING_KEY" | tr -d '[:space:]')" ]; then
            echo "::error::Environment secret PLENIPO_SERVER_SIGNING_KEY is the updater key; the server key must be a key of its own (docs/development/code-signing.md)"
            exit 1
          fi
      - name: Install the signing tool
        if: ${{ !inputs.dry_run }}
        run: cargo install artifact-signing-cli --version 0.11.0 --locked
      # The tool defaults to signtool at one fixed Windows SDK version and the Azure CLI at one
      # fixed path, and stops if either is elsewhere. Find both, so a runner update cannot break it.
      - name: Find signtool and the Azure CLI for the signing tool
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe (Windows SDK) was not found on this runner" }
          $az = (Get-Command az.cmd -ErrorAction SilentlyContinue).Source
          if (-not $az) { throw "The Azure CLI (az.cmd) was not found on this runner" }
          "signtool: $($signtool.FullName)"
          "Azure CLI: $az"
          "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          "AZURE_CLI_PATH=$az" >> $env:GITHUB_ENV
      - name: Build release app and NSIS installer, signed
        if: ${{ !inputs.dry_run }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # The updater key's public half, built into Plenipo (ADR-038).
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
          # 8 West's Microsoft app ID (ADR-065 §6), Slack app's client ID (ADR-070 §3), and GitHub
          # App's client ID and short name (ADR-204): public, not secrets. Until the owner adds a
          # variable, Plenipo says it has no app for that service yet (an organization or
          # workspace can use its own; GitHub has no other).
          PLENIPO_MICROSOFT_APP_ID: ${{ vars.PLENIPO_MICROSOFT_APP_ID }}
          PLENIPO_SLACK_CLIENT_ID: ${{ vars.PLENIPO_SLACK_CLIENT_ID }}
          PLENIPO_GITHUB_CLIENT_ID: ${{ vars.PLENIPO_GITHUB_CLIENT_ID }}
          PLENIPO_GITHUB_APP_SLUG: ${{ vars.PLENIPO_GITHUB_APP_SLUG }}
          # Phase 14 (ADR-140 §4): phone access reaches 8 West's relay only once the owner sets
          # the repository variable PLENIPO_RELAY_LIVE to "true" (the relay change is live).
          # Until then the switch says "Coming soon".
          PLENIPO_RELAY_LIVE: ${{ vars.PLENIPO_RELAY_LIVE }}
          # Never a test stand-in in a release (an empty value is ignored).
          PLENIPO_CONNECTIONS_STAND_IN: ""
          PLENIPO_AI_TOOL_RELEASES: ""
          PLENIPO_REMOTE_STAND_IN: ""
          PLENIPO_REMOTE_PAGE: ""
          PLENIPO_NOTICES_STAND_IN: ""
        # Only releases sign: tauri.signing.conf.json is merged here, never in CI or `pnpm build`.
        # --verbose shows the signing tool's own error if it fails; Tauri hides it otherwise.
        run: |
          # The tool signs in by running az.cmd, and Windows will not pass a line break to a batch
          # file, so a secret pasted with one fails as "batch file arguments are invalid". Trim the
          # ends, say which secret needed it (never its value), and refuse one broken in the middle.
          foreach ($name in 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET') {
            $value = [Environment]::GetEnvironmentVariable($name)
            $trimmed = $value.Trim()
            if ($trimmed -ne $value) {
              "::warning::Environment secret $name starts or ends with a space or line break; it was trimmed for this run. Save it again without one (docs/development/code-signing.md)."
              [Environment]::SetEnvironmentVariable($name, $trimmed)
            }
            if ($trimmed -match '\s') { throw "Environment secret $name has a space or line break inside it; save it again (docs/development/code-signing.md)" }
          }
          pnpm --filter @plenipo/desktop tauri build --verbose --config "${{ github.workspace }}/apps/desktop/src-tauri/tauri.signing.conf.json"
      # ADR-052: a dry run never touches a signing secret. It builds the same app and installer
      # without the signing config, so nothing signs it, and keeps it for 7 days to look at. The
      # signatures, their checks, and the release below are for a real release only.
      - name: Build release app and NSIS installer, unsigned (dry run)
        if: inputs.dry_run
        env:
          # Not secrets; built in so a dry-run installer is otherwise the same as a release one.
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
          PLENIPO_MICROSOFT_APP_ID: ${{ vars.PLENIPO_MICROSOFT_APP_ID }}
          PLENIPO_SLACK_CLIENT_ID: ${{ vars.PLENIPO_SLACK_CLIENT_ID }}
          PLENIPO_GITHUB_CLIENT_ID: ${{ vars.PLENIPO_GITHUB_CLIENT_ID }}
          PLENIPO_GITHUB_APP_SLUG: ${{ vars.PLENIPO_GITHUB_APP_SLUG }}
          PLENIPO_RELAY_LIVE: ${{ vars.PLENIPO_RELAY_LIVE }}
          PLENIPO_CONNECTIONS_STAND_IN: ""
          PLENIPO_AI_TOOL_RELEASES: ""
          PLENIPO_REMOTE_STAND_IN: ""
          PLENIPO_REMOTE_PAGE: ""
          PLENIPO_NOTICES_STAND_IN: ""
        run: pnpm --filter @plenipo/desktop tauri build --verbose
      - name: Keep the unsigned installer (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plenipo-unsigned-installer-dry-run
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error
      # Linux's files (Phase 23, ADR-152), from the Linux job above: the AppImage gets its updater
      # signature here, with the same key, and both are published with the installer.
      - name: The Linux files, built and checked on Ubuntu
        if: ${{ !inputs.dry_run }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plenipo-linux
          path: linux-dist
      # ADR-038: the finished installer (already signed as 8 West above) and the AppImage get the
      # updater signature, over their final bytes and naming this version, with Tauri's tool.
      - name: Sign the installer and the AppImage with the updater key, for this version
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./package.json').version")
          installer=(target/release/bundle/nsis/*-setup.exe)
          appimage="linux-dist/Plenipo_${version}_amd64.AppImage"
          test -f "${installer[0]}"
          test -f "$appimage"
          # A key pasted with a space or line break fails to decode: the key is base64, so every
          # space and line break is dropped; the password loses only a line break at its end.
          key=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')
          password=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | tr -d '\r\n')
          if [ "$key" != "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::Environment secret TAURI_SIGNING_PRIVATE_KEY has spaces or line breaks; they were dropped for this run. Save it again without them (docs/development/code-signing.md)."
          fi
          for file in "${installer[0]}" "$appimage"; do
            TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password" \
              pnpm --filter @plenipo/desktop tauri signer sign --app-version "$version" \
              "$GITHUB_WORKSPACE/$file"
          done
      - name: The updater signatures are Plenipo's, for this version, and latest.json is written
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
        run: |
          version=$(node -p "require('./package.json').version")
          installer=(target/release/bundle/nsis/*-setup.exe)
          appimage="linux-dist/Plenipo_${version}_amd64.AppImage"
          test -f "${installer[0]}"
          for file in "${installer[0]}" "$appimage"; do
            if [ ! -f "$file.sig" ]; then
              echo "::error::No updater signature was made ($file.sig); check the updater key secrets"
              exit 1
            fi
            # The same check Plenipo makes before installing: the key built into it, this version.
            cargo run --release --locked -p plenipo-capabilities --example verify_update -- \
              "$file" "$file.sig" "$version"
          done
          # Plenipo never offers a pre-release as an update, so a pre-release has no latest.json.
          case "$version" in
            *-*)
              echo "A pre-release: no latest.json (updates offer full releases only)."
              exit 0
              ;;
          esac
          notes="docs/releases/v$version.md"
          if [ ! -f "$notes" ]; then notes="$RUNNER_TEMP/no-notes.md"; printf '# v%s\n' "$version" > "$notes"; fi
          # One latest.json for every system (Phase 23): Windows' installer and Linux's AppImage.
          node scripts/update-manifest.mjs "$version" "$notes" target/release/bundle/nsis/latest.json \
            windows-x86_64 "${installer[0]}" "${installer[0]}.sig" \
            linux-x86_64 "$appimage" "$appimage.sig"
      # Checked inside the installer: that copy of the app is the one customers get. Tauri leaves
      # target/release/plenipo-desktop.exe unsigned after bundling, so that file proves nothing.
      - name: The installer and the app inside it are signed by 8 West Ventures, LLC, with a timestamp
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer was built" }
          $inside = Join-Path $env:RUNNER_TEMP "installer-contents"
          & 7z x $installer.FullName "-o$inside" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not open $($installer.Name)" }
          $app = Get-ChildItem $inside -Recurse -Filter plenipo-desktop.exe | Select-Object -First 1
          if (-not $app) { throw "plenipo-desktop.exe is not inside $($installer.Name)" }
          foreach ($f in @($installer, $app)) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            "{0}: {1}; signed by {2}; timestamped by {3}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject, $s.TimeStamperCertificate.Subject
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($s.StatusMessage)" }
            if ($s.SignerCertificate.Subject -notlike '*8 West Ventures, LLC*') { throw "$($f.Name) is signed by someone else: $($s.SignerCertificate.Subject)" }
            # The certificate lasts only days; the timestamp keeps the signature valid after that.
            if (-not $s.TimeStamperCertificate) { throw "$($f.Name) has no timestamp, so its signature would stop being valid within days" }
          }
      # Phase 14 (ADR-146, ADR-148): the phone's page, built from this release's own source for
      # remote.getplenipo.com, with 8 West's relay name built in (never a stand-in). The updater on
      # the page's own server serves it from the release.
      - name: Build the phone's page
        shell: bash
        env:
          PLENIPO_RELAY_PHONE: ""
        run: |
          version=$(node -p "require('./package.json').version")
          pnpm --filter @plenipo/remote build
          grep -q "connect-src wss://relay.getplenipo.com" apps/remote/dist/index.html
          grep -q "wss://relay.getplenipo.com/plenipo/v1/phone" apps/remote/dist/sw.js
          if grep -rq "127.0.0.1" apps/remote/dist; then
            echo "::error::The phone's page names a test address"
            exit 1
          fi
          page="plenipo-phone-page-$version.zip"
          (cd apps/remote/dist && 7z a -tzip "$GITHUB_WORKSPACE/$page" . > /dev/null)
          (cd "$GITHUB_WORKSPACE" && sha256sum "$page" > "$page.sha256")
      # Plenipo's own relay (Phase 14, ADR-149), from its own job above.
      - name: Plenipo's relay, built static on Linux
        if: ${{ !inputs.dry_run }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plenipo-relay
          path: relay-dist
      # ADR-210: the relay and the phone's page get a signature with the server key, over their
      # final bytes, naming each file and this version, with Tauri's tool (the same format as the
      # updater signature, so the servers check it with minisign). A key of its own, never the
      # updater key, so a signed installer can never pass for a relay program or a page.
      - name: Sign the relay and the phone's page with the server key, for this version
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          PLENIPO_SERVER_SIGNING_KEY: ${{ secrets.PLENIPO_SERVER_SIGNING_KEY }}
          PLENIPO_SERVER_SIGNING_KEY_PASSWORD: ${{ secrets.PLENIPO_SERVER_SIGNING_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./package.json').version")
          relay="relay-dist/plenipo-relay-$version-linux-x86_64"
          page="plenipo-phone-page-$version.zip"
          test -f "$relay"
          test -f "$page"
          # As for the updater key: spaces and line breaks pasted into the key are dropped.
          key=$(printf '%s' "$PLENIPO_SERVER_SIGNING_KEY" | tr -d '[:space:]')
          password=$(printf '%s' "$PLENIPO_SERVER_SIGNING_KEY_PASSWORD" | tr -d '\r\n')
          if [ "$key" != "$PLENIPO_SERVER_SIGNING_KEY" ]; then
            echo "::warning::Environment secret PLENIPO_SERVER_SIGNING_KEY has spaces or line breaks; they were dropped for this run. Save it again without them (docs/development/code-signing.md)."
          fi
          for file in "$relay" "$page"; do
            TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password" \
              pnpm --filter @plenipo/desktop tauri signer sign --app-version "$version" \
              "$GITHUB_WORKSPACE/$file"
          done
      - name: The server signatures are 8 West's, for this version
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          # The same check the servers make, with the server key's public half: the example reads
          # the key to check against from PLENIPO_UPDATER_PUBLIC_KEY, so the server key goes there
          # for this step only.
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_SERVER_SIGNING_PUBLIC_KEY }}
        run: |
          version=$(node -p "require('./package.json').version")
          relay="relay-dist/plenipo-relay-$version-linux-x86_64"
          page="plenipo-phone-page-$version.zip"
          for file in "$relay" "$page"; do
            if [ ! -f "$file.sig" ]; then
              echo "::error::No server signature was made ($file.sig); check the server key secrets"
              exit 1
            fi
            cargo run --release --locked -p plenipo-capabilities --example verify_update -- \
              "$file" "$file.sig" "$version"
            # The servers also check the file name written inside the signature.
            if ! base64 -d "$file.sig" | grep -q "$(printf 'trusted comment: .*\tfile:%s\t' "$(basename "$file")")"; then
              echo "::error::$file.sig does not name $(basename "$file")"
              exit 1
            fi
          done
      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          title=$(head -n 1 "$notes" | sed 's/^# *//')
          tail -n +2 "$notes" > "$RUNNER_TEMP/release-notes.md"
          prerelease=()
          case "$RELEASE_TAG" in
            v0.* | *-*) prerelease=(--prerelease) ;;
          esac
          # A pushed tag must already exist; Run workflow creates it on the built commit.
          tag_source=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_source=(--target "$GITHUB_SHA")
          fi
          installer=(target/release/bundle/nsis/*-setup.exe)
          test -f "${installer[0]}"
          # The updater signature and latest.json go with it (ADR-038); a pre-release has no
          # latest.json.
          test -f "${installer[0]}.sig"
          assets=("${installer[@]}" "${installer[0]}.sig")
          # Linux's .deb and AppImage (Phase 23, ADR-152), and the AppImage's updater signature.
          version=$(node -p "require('./package.json').version")
          for file in "linux-dist/Plenipo_${version}_amd64.deb" "linux-dist/Plenipo_${version}_amd64.AppImage" \
            "linux-dist/Plenipo_${version}_amd64.AppImage.sig"; do
            test -f "$file"
            assets+=("$file")
          done
          # The phone's page (Phase 14, ADR-146), its server signature (ADR-210), and its checksum.
          version=$(node -p "require('./package.json').version")
          page="plenipo-phone-page-$version.zip"
          test -f "$page"
          test -f "$page.sig"
          assets+=("$page" "$page.sig" "$page.sha256")
          # Plenipo's own relay (Phase 14, ADR-149), the static Linux program, its server
          # signature (ADR-210), and its checksum.
          relay="relay-dist/plenipo-relay-$version-linux-x86_64"
          test -f "$relay"
          test -f "$relay.sig"
          test -f "$relay.sha256"
          (cd relay-dist && sha256sum -c "plenipo-relay-$version-linux-x86_64.sha256")
          assets+=("$relay" "$relay.sig" "$relay.sha256")
          case "$RELEASE_TAG" in
            *-*) ;;
            *)
              test -f target/release/bundle/nsis/latest.json
              assets+=(target/release/bundle/nsis/latest.json)
              ;;
          esac
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            "${tag_source[@]}" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease[@]}"
