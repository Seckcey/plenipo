name: Release

# Builds the Windows installer and publishes a GitHub release with it attached, in either of two
# ways (docs/development/versioning.md → Releasing):
# - Actions → Release → Run workflow (on `main`): releases the version in package.json. The tag
#   `vX.Y.Z` is created on that commit only after the installer builds.
# - Pushing a tag `vX.Y.Z`: releases that commit.
#
# The installer and the app are signed as 8 West Ventures, LLC through Azure Artifact Signing
# (docs/development/code-signing.md). The signing secrets live in the GitHub Environment `release`
# (ADR-052, signing behind the owner's approval): only `main` and `v*` tags may use it, and the
# owner approves each release run before its job starts. Run workflow with "dry run" ticked uses
# the empty Environment `dry-run` instead: it builds an unsigned installer from any branch, with no
# approval and no secret, checks nothing about signing, and keeps the installer as a download; it
# publishes nothing.
#
# Updates (Phase 13, ADR-038): the installer also gets an updater signature made with the updater
# key (Environment secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD), the
# key's public half is built into Plenipo (repository variable PLENIPO_UPDATER_PUBLIC_KEY), and the
# release carries latest.json, which installed copies read once a day.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build an unsigned installer only, publish nothing (any branch, no approval)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer and publish release
    runs-on: windows-latest
    # ADR-052: a release uses the Environment `release`, which holds the signing secrets, lets only
    # `main` and `v*` tags in, and waits for the owner's approval before the job starts. A dry run
    # uses `dry-run`, which holds nothing and asks nobody, so a dry run can never sign.
    environment: ${{ inputs.dry_run == true && 'dry-run' || 'release' }}
    steps:
      # Once the `release` Environment's branch rule is in place, GitHub refuses such a run before
      # this step; this step says why in plain words when the rule is not there yet.
      - name: Run workflow releases `main` only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.dry_run
        shell: bash
        run: |
          echo "::error::Run the Release workflow on main (it was started on $GITHUB_REF_NAME)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the product version, and release notes exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm versions:check
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: nothing is published, so the tag and release notes are not checked."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$version"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::error::$tag is already released; bump the version first"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::The tag $tag already exists; push it again to release it, or bump the version"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "::error::Tag $tag does not match the product version $version"
              exit 1
            fi
          fi
          if [ ! -f "docs/releases/$tag.md" ]; then
            echo "::error::Missing release notes: docs/releases/$tag.md"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      # A dry run has no secrets to check (ADR-052): it builds unsigned, further down.
      - name: Signing secrets are set
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
          PLENIPO_MICROSOFT_APP_ID: ${{ vars.PLENIPO_MICROSOFT_APP_ID }}
          PLENIPO_SLACK_CLIENT_ID: ${{ vars.PLENIPO_SLACK_CLIENT_ID }}
        run: |
          # A release never signs in with the end-to-end tests' stand-in app IDs (Phase 20),
          # compared as the build reads them: without spaces, the Microsoft one in small letters.
          microsoft_id="$(printf %s "$PLENIPO_MICROSOFT_APP_ID" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          slack_id="$(printf %s "$PLENIPO_SLACK_CLIENT_ID" | tr -d '[:space:]')"
          if [ "$microsoft_id" = "0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0" ]; then
            echo "::error::Repository variable PLENIPO_MICROSOFT_APP_ID is the tests' stand-in ID; set 8 West's app ID (docs/phases/phase-20-microsoft-app-registration.md)"
            exit 1
          fi
          if [ "$slack_id" = "1111111111.2222222222" ]; then
            echo "::error::Repository variable PLENIPO_SLACK_CLIENT_ID is the tests' stand-in ID; set 8 West's Slack app's client ID (docs/phases/phase-20-slack-and-google-apps.md)"
            exit 1
          fi
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Environment secret $name is not set in the Environment 'release'; see docs/development/code-signing.md"
              exit 1
            fi
          done
          # Not a secret: the updater key's public half, built into Plenipo (ADR-038).
          if [ -z "$PLENIPO_UPDATER_PUBLIC_KEY" ]; then
            echo "::error::Repository variable PLENIPO_UPDATER_PUBLIC_KEY is not set; see docs/development/code-signing.md"
            exit 1
          fi
      - name: Install the signing tool
        if: ${{ !inputs.dry_run }}
        run: cargo install artifact-signing-cli --version 0.11.0 --locked
      # The tool defaults to signtool at one fixed Windows SDK version and the Azure CLI at one
      # fixed path, and stops if either is elsewhere. Find both, so a runner update cannot break it.
      - name: Find signtool and the Azure CLI for the signing tool
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe (Windows SDK) was not found on this runner" }
          $az = (Get-Command az.cmd -ErrorAction SilentlyContinue).Source
          if (-not $az) { throw "The Azure CLI (az.cmd) was not found on this runner" }
          "signtool: $($signtool.FullName)"
          "Azure CLI: $az"
          "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          "AZURE_CLI_PATH=$az" >> $env:GITHUB_ENV
      - name: Build release app and NSIS installer, signed
        if: ${{ !inputs.dry_run }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # The updater key's public half, built into Plenipo (ADR-038).
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
          # 8 West's Microsoft app ID (ADR-065 §6) and Slack app's client ID (ADR-070 §3): public,
          # not secrets. Until the owner adds a variable, Plenipo says it has no app for that
          # service yet (an organization or workspace can use its own).
          PLENIPO_MICROSOFT_APP_ID: ${{ vars.PLENIPO_MICROSOFT_APP_ID }}
          PLENIPO_SLACK_CLIENT_ID: ${{ vars.PLENIPO_SLACK_CLIENT_ID }}
          # Phase 14 (ADR-140 §4): phone access reaches 8 West's relay only once the owner sets
          # the repository variable PLENIPO_RELAY_LIVE to "true" (the relay change is live).
          # Until then the switch says "Coming soon".
          PLENIPO_RELAY_LIVE: ${{ vars.PLENIPO_RELAY_LIVE }}
          # Never a test stand-in in a release (an empty value is ignored).
          PLENIPO_CONNECTIONS_STAND_IN: ""
          PLENIPO_AI_TOOL_RELEASES: ""
          PLENIPO_REMOTE_STAND_IN: ""
          PLENIPO_REMOTE_PAGE: ""
        # Only releases sign: tauri.signing.conf.json is merged here, never in CI or `pnpm build`.
        # --verbose shows the signing tool's own error if it fails; Tauri hides it otherwise.
        run: |
          # The tool signs in by running az.cmd, and Windows will not pass a line break to a batch
          # file, so a secret pasted with one fails as "batch file arguments are invalid". Trim the
          # ends, say which secret needed it (never its value), and refuse one broken in the middle.
          foreach ($name in 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET') {
            $value = [Environment]::GetEnvironmentVariable($name)
            $trimmed = $value.Trim()
            if ($trimmed -ne $value) {
              "::warning::Environment secret $name starts or ends with a space or line break; it was trimmed for this run. Save it again without one (docs/development/code-signing.md)."
              [Environment]::SetEnvironmentVariable($name, $trimmed)
            }
            if ($trimmed -match '\s') { throw "Environment secret $name has a space or line break inside it; save it again (docs/development/code-signing.md)" }
          }
          pnpm --filter @plenipo/desktop tauri build --verbose --config "${{ github.workspace }}/apps/desktop/src-tauri/tauri.signing.conf.json"
      # ADR-052: a dry run never touches a signing secret. It builds the same app and installer
      # without the signing config, so nothing signs it, and keeps it for 7 days to look at. The
      # signatures, their checks, and the release below are for a real release only.
      - name: Build release app and NSIS installer, unsigned (dry run)
        if: inputs.dry_run
        env:
          # Not secrets; built in so a dry-run installer is otherwise the same as a release one.
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
          PLENIPO_MICROSOFT_APP_ID: ${{ vars.PLENIPO_MICROSOFT_APP_ID }}
          PLENIPO_SLACK_CLIENT_ID: ${{ vars.PLENIPO_SLACK_CLIENT_ID }}
          PLENIPO_RELAY_LIVE: ${{ vars.PLENIPO_RELAY_LIVE }}
          PLENIPO_CONNECTIONS_STAND_IN: ""
          PLENIPO_AI_TOOL_RELEASES: ""
          PLENIPO_REMOTE_STAND_IN: ""
          PLENIPO_REMOTE_PAGE: ""
        run: pnpm --filter @plenipo/desktop tauri build --verbose
      - name: Keep the unsigned installer (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plenipo-unsigned-installer-dry-run
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error
      # ADR-038: the finished installer (already signed as 8 West above) gets the updater
      # signature, over its final bytes and naming this version, with Tauri's signing tool.
      - name: Sign the installer with the updater key, for this version
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./package.json').version")
          installer=(target/release/bundle/nsis/*-setup.exe)
          test -f "${installer[0]}"
          # A key pasted with a space or line break fails to decode: the key is base64, so every
          # space and line break is dropped; the password loses only a line break at its end.
          key=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')
          password=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | tr -d '\r\n')
          if [ "$key" != "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::Environment secret TAURI_SIGNING_PRIVATE_KEY has spaces or line breaks; they were dropped for this run. Save it again without them (docs/development/code-signing.md)."
          fi
          TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password" \
            pnpm --filter @plenipo/desktop tauri signer sign --app-version "$version" \
            "$GITHUB_WORKSPACE/${installer[0]}"
      - name: The updater signature is Plenipo's, for this version, and latest.json is written
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          PLENIPO_UPDATER_PUBLIC_KEY: ${{ vars.PLENIPO_UPDATER_PUBLIC_KEY }}
        run: |
          version=$(node -p "require('./package.json').version")
          installer=(target/release/bundle/nsis/*-setup.exe)
          test -f "${installer[0]}"
          sig="${installer[0]}.sig"
          if [ ! -f "$sig" ]; then
            echo "::error::No updater signature was made (${sig}); check the updater key secrets"
            exit 1
          fi
          # The same check Plenipo makes before installing: the key built into it, this version.
          cargo run --release --locked -p plenipo-capabilities --example verify_update -- \
            "${installer[0]}" "$sig" "$version"
          # Plenipo never offers a pre-release as an update, so a pre-release has no latest.json.
          case "$version" in
            *-*)
              echo "A pre-release: no latest.json (updates offer full releases only)."
              exit 0
              ;;
          esac
          notes="docs/releases/v$version.md"
          if [ ! -f "$notes" ]; then notes="$RUNNER_TEMP/no-notes.md"; printf '# v%s\n' "$version" > "$notes"; fi
          node scripts/update-manifest.mjs "$version" "${installer[0]}" "$sig" "$notes" \
            target/release/bundle/nsis/latest.json
      # Checked inside the installer: that copy of the app is the one customers get. Tauri leaves
      # target/release/plenipo-desktop.exe unsigned after bundling, so that file proves nothing.
      - name: The installer and the app inside it are signed by 8 West Ventures, LLC, with a timestamp
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer was built" }
          $inside = Join-Path $env:RUNNER_TEMP "installer-contents"
          & 7z x $installer.FullName "-o$inside" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not open $($installer.Name)" }
          $app = Get-ChildItem $inside -Recurse -Filter plenipo-desktop.exe | Select-Object -First 1
          if (-not $app) { throw "plenipo-desktop.exe is not inside $($installer.Name)" }
          foreach ($f in @($installer, $app)) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            "{0}: {1}; signed by {2}; timestamped by {3}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject, $s.TimeStamperCertificate.Subject
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($s.StatusMessage)" }
            if ($s.SignerCertificate.Subject -notlike '*8 West Ventures, LLC*') { throw "$($f.Name) is signed by someone else: $($s.SignerCertificate.Subject)" }
            # The certificate lasts only days; the timestamp keeps the signature valid after that.
            if (-not $s.TimeStamperCertificate) { throw "$($f.Name) has no timestamp, so its signature would stop being valid within days" }
          }
      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          title=$(head -n 1 "$notes" | sed 's/^# *//')
          tail -n +2 "$notes" > "$RUNNER_TEMP/release-notes.md"
          prerelease=()
          case "$RELEASE_TAG" in
            v0.* | *-*) prerelease=(--prerelease) ;;
          esac
          # A pushed tag must already exist; Run workflow creates it on the built commit.
          tag_source=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_source=(--target "$GITHUB_SHA")
          fi
          installer=(target/release/bundle/nsis/*-setup.exe)
          test -f "${installer[0]}"
          # The updater signature and latest.json go with it (ADR-038); a pre-release has no
          # latest.json.
          test -f "${installer[0]}.sig"
          assets=("${installer[@]}" "${installer[0]}.sig")
          case "$RELEASE_TAG" in
            *-*) ;;
            *)
              test -f target/release/bundle/nsis/latest.json
              assets+=(target/release/bundle/nsis/latest.json)
              ;;
          esac
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            "${tag_source[@]}" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease[@]}"
