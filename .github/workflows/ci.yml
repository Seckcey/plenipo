name: CI

# Pull requests, and main after a merge. (A push to a branch with a pull request used to start a
# second copy of every job.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops that pull request's older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Documentation only (Markdown files, and pictures under docs/) needs only the Docs check: the
  # long jobs below are skipped, and a skipped job counts as passed. Anything else, or a run by
  # hand, runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! files=$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null) \
            || [ -z "$files" ]; then
            echo "Could not tell what changed; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          code=$(printf '%s\n' "$files" \
            | grep -Eiv '\.md$|^docs/.*\.(png|jpe?g|gif|svg|webp)$' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: the Docs check is enough."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Docs (format, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check

  frontend:
    name: Frontend (versions, format, lint, typecheck, test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm versions:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Rust (fmt, clippy, test, bindings)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            gnome-keyring dbus
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # ADR-153: the Vault's test of the system's own store. On Linux that is the desktop's
      # password store, which this machine has none of, so GNOME Keyring is started for it, its
      # login keyring made and unlocked with a throwaway password (it must be started as a
      # daemon, and the password must end in a line break, or it stays locked).
      - name: The Vault in the system's own store (GNOME Keyring)
        run: |
          # The output is shown whether the test passes or not (set -e would stop before it).
          status=0
          out=$(dbus-run-session -- bash -c 'gnome-keyring-daemon --components=secrets --daemonize --unlock <<< plenipo-ci > /dev/null && PLENIPO_TEST_REAL_VAULT=1 cargo test --locked -p plenipo-capabilities --lib vault::tests::the_systems_own_store_keeps_and_forgets_a_value -- --exact' 2>&1) || status=$?
          echo "$out"
          [ "$status" -eq 0 ] || { echo "::error::The Vault's test of the system's own store failed (exit $status)"; exit 1; }
          echo "$out" | grep -q "test result: ok. 1 passed" || { echo "::error::The Vault's test of the system's own store did not run and pass"; exit 1; }
      - name: Generated TypeScript bindings are up to date
        run: |
          if [ -n "$(git status --porcelain packages/types/src/generated)" ]; then
            git status --porcelain packages/types/src/generated
            git diff packages/types/src/generated
            echo "::error::Run 'pnpm bindings' and commit packages/types/src/generated"
            exit 1
          fi
      # Phase 14 (ADR-149, Plenipo runs its own relay): the relay builds as the static Linux program
      # a release attaches, answers on this machine, and stops cleanly.
      - name: Plenipo's relay builds static (musl), answers, and stops
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p plenipo-relay --bin plenipo-relay
          relay=target/x86_64-unknown-linux-musl/release/plenipo-relay
          file "$relay" | grep -q "static" || { echo "::error::The relay is not a static program"; file "$relay"; exit 1; }
          "$relay" --version
          # A release build has no test hooks: the line a test copy prints is not in it.
          if grep -q "the relay listens on" "$relay"; then
            echo "::error::The relay was built with its test hooks"
            exit 1
          fi
          PLENIPO_RELAY_OFF_FILE="$RUNNER_TEMP/plenipo-relay-off" "$relay" 18790 &
          pid=$!
          sleep 1
          curl -fsS http://127.0.0.1:18790/healthz | grep -qx ok
          kill -TERM "$pid"
          wait "$pid"
      # ADR-210 (the page and the relay are signed like the installer; security finding P-SRV-1):
      # the servers' updaters install a relay or a phone page only when 8 West's server key signed
      # it, for that file and that version, never take a step back on their own, and never run the
      # download as root. Linux only, as root: it runs the relay's program as another user.
      - name: The server updaters install only what 8 West signed
        run: |
          sudo apt-get install -y minisign zip
          sudo bash scripts/updater-signing-check.sh

  e2e:
    name: E2E (real app via tauri-driver, Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Tauri, WebDriver, and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            webkit2gtk-driver xvfb gnome-keyring dbus
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      # Phase 13 (ADR-038): this copy trusts a throwaway updater key and looks for updates only on
      # this machine (127.0.0.1), so the update test can find a new version. Made here, never
      # kept, never a release.
      - name: A throwaway updater key for the update test
        run: |
          pnpm --filter @plenipo/desktop tauri signer generate --ci --password= -w "$RUNNER_TEMP/test-updater.key"
          echo "PLENIPO_UPDATER_PUBLIC_KEY=$(cat "$RUNNER_TEMP/test-updater.key.pub")" >> "$GITHUB_ENV"
          echo "PLENIPO_UPDATE_ENDPOINT=http://127.0.0.1:8765/latest.json" >> "$GITHUB_ENV"
          echo "PLENIPO_E2E_UPDATER_KEY=$RUNNER_TEMP/test-updater.key" >> "$GITHUB_ENV"
      # Phase 19 (ADR-059): this copy reads the AI tools' release lists from a stand-in on this
      # machine (127.0.0.1), so the AI tools test can offer a new version. Never a release.
      - name: A stand-in for the AI tools' release lists
        run: echo "PLENIPO_AI_TOOL_RELEASES=http://127.0.0.1:8766" >> "$GITHUB_ENV"
      # Phase 20 (ADR-065, ADR-070): this copy signs in to a stand-in for Microsoft's, Slack's, and
      # Google's sign-ins and services on this machine (127.0.0.1), with the stand-in's own app
      # IDs, so the Connections tests can connect, read, and send. Phase 25 (ADR-204) adds GitHub's
      # short-code sign-in and its list of repositories. Never a release; the real app IDs are
      # never used here.
      - name: A stand-in for the connections' services
        run: |
          echo "PLENIPO_CONNECTIONS_STAND_IN=http://127.0.0.1:8767" >> "$GITHUB_ENV"
          echo "PLENIPO_MICROSOFT_APP_ID=0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0" >> "$GITHUB_ENV"
          echo "PLENIPO_SLACK_CLIENT_ID=1111111111.2222222222" >> "$GITHUB_ENV"
          echo "PLENIPO_GITHUB_CLIENT_ID=Iv1.0123456789abcdef" >> "$GITHUB_ENV"
          echo "PLENIPO_GITHUB_APP_SLUG=plenipo-test-app" >> "$GITHUB_ENV"
      # Phase 11A (ADR-104): this copy also trusts the license contract's test key, and sends its
      # weekly license check to a stand-in for 8 West on this machine (127.0.0.1), so the tests
      # can turn Pro on and check the request byte for byte. Never a release.
      - name: A stand-in for 8 West's license check
        run: echo "PLENIPO_LICENSE_STAND_IN=http://127.0.0.1:8768" >> "$GITHUB_ENV"
      # Phase 14 (ADR-143 §14, ADR-146 §5, ADR-149): this copy reaches Plenipo's own relay running on
      # this machine (127.0.0.1, built for the tests), and makes pairing links and passkeys for the
      # phone's page served here (localhost). The page is built for the same address, and a test
      # browser plays the phone. Never a release; the relay at relay.getplenipo.com is never used.
      - name: Plenipo's relay on this machine, and the phone's page
        run: |
          echo "PLENIPO_REMOTE_STAND_IN=http://127.0.0.1:8769" >> "$GITHUB_ENV"
          echo "PLENIPO_REMOTE_PAGE=http://localhost:8771" >> "$GITHUB_ENV"
          echo "PLENIPO_RELAY_PHONE=ws://127.0.0.1:8769/plenipo/v1/phone" >> "$GITHUB_ENV"
          # Part 14C: notices go to a stand-in for the phones' notice services here.
          echo "PLENIPO_NOTICES_STAND_IN=http://127.0.0.1:8772" >> "$GITHUB_ENV"
      - name: Build release app
        run: pnpm --filter @plenipo/desktop tauri build --no-bundle --features license-test-keys
      - name: Build fake agent CLIs for Phase 3 tests
        run: cargo build --release --locked -p plenipo-runtime --bin plenipo-fake-agent
      - name: Build the synthetic SSH server and the connections' stand-in, and the test add-on program
        run: cargo build --release --locked -p plenipo-capabilities --bin plenipo-test-sshd --bin plenipo-test-services --bin plenipo-test-addon
      # The real-app tests run against Plenipo's real relay (ADR-149), built with its test hooks:
      # that copy also trusts the contract's test key and prints what the test reads. The stand-in
      # relay stays for the Rust tests' bad-relay modes.
      - name: Build Plenipo's relay for the tests, and the phone's page, for Phase 14 tests
        run: |
          cargo build --release --locked -p plenipo-relay --features test-hooks --bin plenipo-relay
          echo "PLENIPO_TEST_RELAY=$GITHUB_WORKSPACE/target/release/plenipo-relay" >> "$GITHUB_ENV"
          pnpm --filter @plenipo/remote build
          grep -q "ws://127.0.0.1:8769" apps/remote/dist/index.html
      # Phase 10 starts the runner's Google Chrome, with its sandbox on (as on Windows). Ubuntu's
      # AppArmor keeps unprivileged programs from the user namespaces that sandbox needs.
      - name: Let Chrome's sandbox use user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run end-to-end tests
        env:
          PLENIPO_E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
          # The runner's browsers can take close to 30 seconds to start; allow 90 (ADR-028).
          PLENIPO_BROWSER_START_SECONDS: "90"
          # The keyring daemon's own messages, and how it ended (tests/e2e/run-ci.sh).
          PLENIPO_E2E_KEYRING_LOG: ${{ runner.temp }}/e2e-keyring/daemon.log
        # ADR-153: the Vault on Linux is the desktop's password store. This machine has none, so
        # GNOME Keyring is started for the run, unlocked, on the run's own session bus.
        run: dbus-run-session -- bash tests/e2e/run-ci.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      # When the run fails: the keyring daemon's log, and any process the kernel ended for want
      # of memory (twice the daemon was gone partway through a run).
      - name: Keep the keyring daemon's log
        if: failure()
        run: |
          sudo dmesg -T 2> /dev/null | grep -iE "out of memory|killed process|gnome-keyring" | tail -20 \
            > "$RUNNER_TEMP/e2e-keyring/kernel.log" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-keyring
          path: ${{ runner.temp }}/e2e-keyring/
          if-no-files-found: ignore
          retention-days: 14

  # Phase 23, Wave 0 (ADR-150): the Mac. Clippy and the tests run on a Mac for every change, and
  # what still fails is reported (in this job's summary, and as a warning), not as a failed check:
  # nothing has been ported yet. Wave 1 makes both pass; then the two `continue-on-error` lines
  # go, and this job counts like the others.
  macos:
    name: Mac (clippy, test; reported, not yet required)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - id: test
        continue-on-error: true
        timeout-minutes: 45
        # Every test group runs even after one fails, so the summary lists all that still fail.
        run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/mac-test.log"
        env:
          # ADR-153: the Vault's test of the system's own store (the Mac's Keychain).
          PLENIPO_TEST_REAL_VAULT: "1"
      - name: What still fails on a Mac
        if: always()
        env:
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          {
            echo "### Mac (Phase 23: reported, not yet required)"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| \`cargo clippy\` | $CLIPPY |"
            echo "| \`cargo test\` | $TEST |"
            if [ -f "$RUNNER_TEMP/mac-test.log" ]; then
              log=$(sed -E 's/\x1B\[[0-9;]*[mK]//g' "$RUNNER_TEMP/mac-test.log")
              failing=$(printf '%s\n' "$log" | sed -nE 's/^---- (.*) stdout ----$/\1/p' | sort -u)
              broken=$(printf '%s\n' "$log" | grep -E '^error: could not compile' | sort -u || true)
              if [ -n "$failing" ]; then
                echo ""
                echo "**Tests that fail on a Mac:**"
                echo ""
                printf '%s\n' "$failing" | sed 's/^/- `/; s/$/`/'
              fi
              if [ -n "$broken" ]; then
                echo ""
                echo "**What does not compile on a Mac:**"
                echo ""
                printf '%s\n' "$broken" | sed 's/^/- /'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CLIPPY" != "success" ] || [ "$TEST" != "success" ]; then
            echo "::warning title=Mac::On a Mac, cargo clippy: $CLIPPY; cargo test: $TEST. Phase 23's Wave 1 makes both pass (ADR-150)."
          fi

  windows:
    name: Windows (test, build, installer, launch smoke, installer tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The repository's own scripts and clippy on Windows too: a path written with "\" or code
      # used only on Unix is caught here, not only on the owner's PC.
      - run: node --test scripts/*.test.mjs
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # ADR-153: the Vault's test of the system's own store (Windows Credential Manager).
      - run: cargo test --workspace --locked
        env:
          PLENIPO_TEST_REAL_VAULT: "1"
      # Phase 13 (ADR-038): this run's copy trusts a throwaway updater key and looks for updates
      # only on this machine (127.0.0.1), so the installer tests can install an update the way
      # Plenipo does. The key is made here and never kept. Released copies are built by the
      # Release workflow with 8 West's key and GitHub Releases instead.
      - name: A throwaway updater key for the update test
        shell: pwsh
        run: |
          pnpm --filter '@plenipo/desktop' tauri signer generate --ci --password= -w "$env:RUNNER_TEMP\test-updater.key"
          if ($LASTEXITCODE -ne 0) { throw "the test updater key was not made" }
          $public = (Get-Content "$env:RUNNER_TEMP\test-updater.key.pub" -Raw).Trim()
          "PLENIPO_UPDATER_PUBLIC_KEY=$public" >> $env:GITHUB_ENV
          "PLENIPO_UPDATE_ENDPOINT=http://127.0.0.1:8765/latest.json" >> $env:GITHUB_ENV
      - name: Build release app and NSIS installer
        run: pnpm build
      - name: Launch smoke test (app must render the shell and report ready)
        shell: pwsh
        env:
          PLENIPO_SMOKE_TEST: "1"
          PLENIPO_SMOKE_TIMEOUT_SECS: "90"
        run: |
          $exe = "target/release/plenipo-desktop.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle # cache the handle so ExitCode is available after exit
          if (-not $p.WaitForExit(150000)) {
            Stop-Process -Id $p.Id -Force
            throw "Plenipo did not exit within 150s"
          }
          Write-Host "Plenipo exited with code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Launch smoke test failed (exit $($p.ExitCode))" }
      - name: The published 1.8.0 installer (to upgrade from)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.8.0 --repo "$GITHUB_REPOSITORY" --pattern '*-setup.exe' --dir "$RUNNER_TEMP/old"
      # Install, run, crash, restart (simulated), upgrade from 1.8.0, go back and forward, update,
      # uninstall, and list what is left behind (Phase 13). A real restart is the owner's check.
      - name: Installer tests (install, upgrade, update, recovery, uninstall)
        shell: pwsh
        run: |
          $new = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $old = (Get-ChildItem "$env:RUNNER_TEMP/old/*-setup.exe" | Select-Object -First 1).FullName
          $version = node -p "require('./package.json').version"
          ./scripts/windows/installer-tests.ps1 -NewInstaller $new -OldInstaller $old -Version $version `
            -UpdaterKey "$env:RUNNER_TEMP\test-updater.key" -UpdatesDir "$env:RUNNER_TEMP\updates"
      # The logs and the last report are on another drive than the workspace: gather them first.
      - name: Gather Plenipo's log files (when a test failed)
        if: failure()
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'windows-logs'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $logs = Join-Path $env:LOCALAPPDATA 'com.eightwest.plenipo\logs'
          if (Test-Path $logs) { Copy-Item "$logs\*" $out -Force }
          $report = Join-Path $env:RUNNER_TEMP 'plenipo-report.json'
          if (Test-Path $report) { Copy-Item $report $out -Force }
      - name: Plenipo's log files (when a test failed)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plenipo-windows-logs
          path: windows-logs/
          if-no-files-found: ignore
          retention-days: 7
      # This run's installer trusts this run's throwaway updater key (see above): for testing
      # only, never a release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plenipo-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
