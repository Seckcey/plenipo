[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/ledger",
    "crates/liaison",
    "crates/router",
    "crates/runtime",
    "crates/workforce",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/Seckcey/plenipo"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
