[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/capabilities",
    "crates/core",
    "crates/guard",
    "crates/ledger",
    "crates/liaison",
    "crates/router",
    "crates/runtime",
    "crates/workforce",
]

[workspace.package]
version = "1.15.0"
edition = "2021"
license = "Elastic-2.0"
repository = "https://github.com/Seckcey/plenipo"
rust-version = "1.87"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
