[package]
name = "plenipo-community"
description = "Community (Phase 24): the contract with 8 West's account service in code (contracts/community/v1), each PC's Community keys, sealing and opening items, the report proof, the stamp, and the safety code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# A stand-in for 8 West's account service, for the tests only (contract `contracts/community/v1`).
# A release never builds it.
stand-in = ["dep:tokio"]

[dependencies]
base64 = "0.22"
# Each PC's signing key (ADR-162 §3, contract §7).
ed25519-dalek = "3"
getrandom = "0.3"
# The report proof's tag (ADR-164 §6, contract §7).
hmac = "0.13"
# Sealing for each PC: HPKE (RFC 9180) with X25519, HKDF-SHA256, and AES-256-GCM (ADR-164 §1).
# Only the parts this suite needs; pinned, because the seal must never change under us.
log = "0.4"
hpke = { version = "=0.14.1", default-features = false, features = ["x25519", "aes", "alloc"] }
# The operating system's random bytes, in the form HPKE asks for.
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
# Settings → Community's view, for the screen (`pnpm bindings`).
ts-rs = "11"
# Only the stand-in service uses it: its sockets, its clock for waiting, and its pick-up wake-up.
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"], optional = true }

[dev-dependencies]
# The tests in `tests/` use the stand-in service.
plenipo-community = { path = ".", features = ["stand-in"] }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
