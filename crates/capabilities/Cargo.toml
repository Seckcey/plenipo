[package]
name = "plenipo-capabilities"
description = "Plenipo capability broker: Plenipo's own tools for workers, approvals, grants, and the Vault."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
# Test helper: the runtime's fake Claude Code / Codex CLI, built here too so the broker's
# integration tests can run it (copied as `claude` / `codex`). Never shipped.
name = "plenipo-fake-agent-capabilities"
path = "tests/support/fake_agent.rs"
test = false

[[bin]]
# Test helper: the tool relay the AI tools start (the desktop app runs the same code as
# `plenipo-desktop --plenipo-tools=<ticket>`). Never shipped.
name = "plenipo-tool-relay"
path = "tests/support/relay.rs"
test = false

[[bin]]
# Test helper: a synthetic SSH server on 127.0.0.1 for the Phase 11 end-to-end test (the Rust
# tests run the same server in-process). Never shipped.
name = "plenipo-test-sshd"
path = "tests/support/sshd_main.rs"
test = false

[dependencies]
base64 = "0.22"
dunce = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Mouse and keyboard for computer use (Phase 10): SendInput on Windows, XTest on Linux.
enigo = { version = "0.6", default-features = false }
plenipo-guard = { path = "../guard" }
plenipo-ledger = { path = "../ledger" }
plenipo-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
# SSH to the owner's servers (Phase 11, ADR-025). The `ring` crypto backend builds with the
# Windows toolchain alone (no CMake or NASM).
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The DevTools protocol of Plenipo's browser (Phase 10), over a loopback WebSocket; no TLS.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
ts-rs = "11"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager.
keyring = { version = "3.6", features = ["windows-native"] }
# Which program holds a loopback connection, and its parents (ADR-033: the tool server binds
# a ticket to the AI tool's process tree).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
] }
# Screen capture for computer use (Phase 10).
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The kernel keyring (no desktop secret service needed).
keyring = { version = "3.6", features = ["linux-native"] }
# XTest input and screen capture over X11 (development and CI; Windows is the target).
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
x11rb = "0.13"

[dev-dependencies]
plenipo-liaison = { path = "../liaison" }
plenipo-router = { path = "../router" }
plenipo-workforce = { path = "../workforce" }
tempfile = "3"

[lints.rust]
# The workspace forbids unsafe code. This crate denies it instead, so that exactly one module —
# the Windows lookup of which program holds a loopback connection, behind the tool server's
# ticket check (ADR-033) — may allow it for its calls into Windows. Everywhere else in this
# crate, unsafe code is still a build error.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
