[package]
name = "plenipo-runtime"
description = "Plenipo Runtime: supervised local process execution."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
# Harmless diagnostic child process used by tests (the desktop app embeds the same
# scenarios behind `--plenipo-diagnostic=<scenario>`).
name = "plenipo-diag"
path = "src/bin/plenipo-diag.rs"
test = false

[[bin]]
# Test double for the Claude Code and Codex CLIs (copied as `claude` / `codex` by tests).
name = "plenipo-fake-agent"
path = "src/bin/plenipo-fake-agent.rs"
test = false

[dependencies]
# Each system's own words on screen (Phase 23, ADR-155).
plenipo-core = { path = "../core" }
dunce = "1"
process-wrap = { version = "10", features = ["tokio1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
ts-rs = "11"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# One system call (`dup2`) in the hook that hands Plenipo's browser its two extra pipes.
libc = "0.2"
# The keeper (ADR-157) signals a worker's whole program group: safe wrappers.
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
# Programs that left their group, found by the mark in their environment (ADR-158).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# Process creation flags; and, for a program that gets extra pipes (Plenipo's browser), the
# direct process start with its job object and inheritable handles.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The real redactor, for the tests of live text redacted as whole words (ADR-216).
plenipo-guard = { path = "../guard" }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"

[lints.rust]
# The workspace forbids unsafe code. This crate denies it instead, so that exactly one module —
# `pipes`, which hands a program the two extra pipes Plenipo's browser is controlled over (a
# descriptor move before the program runs on Unix; a direct process start on Windows) — may
# allow it for its calls into the system. Everywhere else in this crate, unsafe code is still a
# build error.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
