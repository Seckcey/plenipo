[package]
name = "plenipo-runtime"
description = "Plenipo Runtime: supervised local process execution."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
# Harmless diagnostic child process used by tests (the desktop app embeds the same
# scenarios behind `--plenipo-diagnostic=<scenario>`).
name = "plenipo-diag"
path = "src/bin/plenipo-diag.rs"
test = false

[dependencies]
dunce = "1"
process-wrap = { version = "10", features = ["tokio1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
ts-rs = "11"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"

[lints]
workspace = true
