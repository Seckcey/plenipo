[package]
name = "plenipo-router"
description = "Plenipo Router: the model registry, role model policies, and explained routing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
plenipo-ledger = { path = "../ledger" }
plenipo-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "11"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
