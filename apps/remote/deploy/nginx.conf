# Plenipo on your phone: the small web server for the phone's page (Phase 14, ADR-146).
# It serves only the page's own files, from the release the updater points `current` at, with the
# page's rules as headers. Made by 8 West Ventures, LLC.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/page/current;
    index index.html;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built files carry their own fingerprint in their names: they never change.
    location /assets/ {
        include /etc/nginx/plenipo-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        try_files $uri =404;
    }

    # `no-transform` everywhere: nothing between this server and the phone (Cloudflare included)
    # may change or add to the page, which holds the phone's keys (ADR-146 §3).

    # The page, its background part, and its manifest: always the newest release's.
    location / {
        include /etc/nginx/plenipo-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/plenipo-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }
}
