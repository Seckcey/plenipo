[package]
name = "plenipo-desktop"
description = "Plenipo Desktop: Tauri backend and privileged command layer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Copies built for the end-to-end tests also trust the license contract's test signing key
# (Phase 11A, ADR-104). The Release workflow never enables it.
license-test-keys = ["plenipo-licensing/test-keys"]

[lib]
name = "plenipo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
plenipo-capabilities = { path = "../../../crates/capabilities" }
plenipo-core = { path = "../../../crates/core" }
plenipo-guard = { path = "../../../crates/guard" }
plenipo-ledger = { path = "../../../crates/ledger" }
plenipo-liaison = { path = "../../../crates/liaison" }
# Free and Pro, the license key, and the weekly check (Phase 11A).
plenipo-licensing = { path = "../../../crates/licensing" }
# Plenipo on your phone (Phase 14).
plenipo-remote = { path = "../../../crates/remote" }
# Community (Phase 24): signing in to the 8 West account, and the contract in code.
plenipo-community = { path = "../../../crates/community" }
plenipo-router = { path = "../../../crates/router" }
plenipo-runtime = { path = "../../../crates/runtime" }
plenipo-workforce = { path = "../../../crates/workforce" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# When Windows last started, to tell a crash from a restart (Phase 13, ADR-036).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# The diagnostics file (Phase 13).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = { version = "0.4", features = ["std"] }
# Tickets for files dropped from File Explorer (Phase 21).
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "~2.4"
# Start with Windows (HKCU Run) and one Plenipo at a time (Phase 13, ADR-036). Their own
# commands are granted to no window.
tauri-plugin-autostart = "~2.5"
tauri-plugin-single-instance = "~2.4"
# One change to an organization at a time (Phase 21, ADR-094): an async lock, on every system.
tokio = { version = "1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["signal"] }

# Let the organization's window open its pop-out panels (Phase 21, ADR-092): WebKitGTK's own
# setting, the version Tauri uses.
[target.'cfg(target_os = "linux")'.dependencies]
# Whether the desktop shows tray icons: a status notifier host on the session bus (Phase 23).
zbus = "5"
webkit2gtk = { version = "2", features = ["v2_40"] }

# The Mac's WKWebView, for the one setting that lets pop-out windows open (Phase 23): the
# version and parts Tauri already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKPreferences"] }

[lints]
workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["test", "tray-icon"] }
# The tests enter the license contract's test key (Phase 11A).
plenipo-licensing = { path = "../../../crates/licensing", features = ["test-keys"] }
# A stand-in for 8 West's license check in the tests (Phase 11A).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
# A stand-in for 8 West's account service, for Community's tests (Phase 24).
plenipo-community = { path = "../../../crates/community", features = ["stand-in"] }
